<!DOCTYPE html>
<html lang="ru">

<title>HK MP5A3 — оружейная</title>
<style>
/* Палитра: тёмные непрозрачные панели, светлый текст, янтарный акцент.
   Контраст текста к фону — не ниже 7:1 для основного и 4.5:1 для вторичного. */
:root{
  --bg:#121417; --panel:rgba(18,20,24,.94); --panel2:#1c1f24; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --tx:#f1efeb; --tx2:#b8bcc2; --tx3:#8c9197; --acc:#e8b45c; --acc2:rgba(232,180,92,.16);
  --good:#7fd08e; --bad:#f0907f; --r:10px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
.boot-in{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--tx2)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.noui .ui{display:none}

.ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px;line-height:1.35}
.ui > *, .ui .bottom > *{pointer-events:auto}
.ui .bottom{pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.btn{font:600 12.5px/1 var(--f);letter-spacing:.03em;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
  padding:0 14px;height:38px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#262a31;border-color:rgba(255,255,255,.34)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--acc2);border-color:var(--acc);color:#ffe2b0}
.btn.off{color:var(--tx3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.fire{background:#5a2620;border-color:#b5584b;color:#ffe3de}
.btn.fire:hover{background:#6e2f27}
.btn:focus-visible,.m-row:focus-visible,.m-opt:focus-visible{outline:2px solid #8fb6e8;outline-offset:2px}

/* левая колонка */
.col-left{position:fixed;left:16px;top:16px;width:272px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px)}
.card{padding:14px 16px}
.c-name{font-size:22px;font-weight:700;letter-spacing:.01em}
.c-sub{margin-top:3px;font-size:12.5px;color:var(--tx2)}
.c-spec{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.c-spec span{color:var(--tx3)} .c-spec b{color:var(--tx);font-weight:600;text-align:right}
.stats{padding:12px 14px;overflow:auto}
.s-t,.m-head span,.m-gt,.h-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.s-t{margin-bottom:8px}
.s-r{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
.s-r span{color:var(--tx2);font-size:12.5px}
.s-r b{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--tx)}
.s-r b small{color:var(--tx3);font-weight:500;font-size:11px}
.s-r em{font-style:normal;font-size:11.5px;margin-left:6px}
.s-r.g em{color:var(--good)} .s-r.b em{color:var(--bad)}
.s-bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.s-bar i{display:block;height:100%;background:#9aa3ad;border-radius:2px}
.s-r.g .s-bar i{background:var(--good)} .s-r.b .s-bar i{background:var(--bad)}

/* меню модификации */
.mods{position:fixed;right:16px;top:16px;bottom:84px;width:350px;display:none;flex-direction:column;overflow:hidden}
.ui.show-mods .mods{display:flex}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.m-head span{font-size:12px;color:var(--tx)}
.m-body{overflow-y:auto;padding:6px 8px 12px;flex:1;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.m-group{margin-top:8px}
.m-gt{padding:6px 6px 4px}
.m-row{display:grid;grid-template-columns:auto 1fr 16px;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;margin:2px 0;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.035);color:var(--tx);font:inherit;cursor:pointer}
.m-row:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
.m-row.open{background:var(--acc2);border-color:rgba(232,180,92,.55)}
.m-l{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.m-v{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row.empty .m-v{color:var(--tx3);font-weight:500}
.m-c{color:var(--tx3);font-size:15px;text-align:center}
.m-opts{padding:6px 0 8px 10px;margin-left:6px;border-left:2px solid rgba(232,180,92,.35);display:flex;flex-direction:column;gap:5px}
.m-pos{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
.m-pl{flex:1;color:var(--tx2);font-size:12px}
.m-pos b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.m-opt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit;cursor:pointer}
.m-opt:hover{border-color:var(--line2);background:#23272d}
.m-opt.on{border-color:var(--acc);background:#2a2518}
.m-opt.off{opacity:.55;cursor:not-allowed}
.o-n{font-size:13px;font-weight:600}
.o-d{margin-top:2px;font-size:11.5px;color:var(--tx2)}
.m-opt.off .o-d{color:#e7b8a8}
.o-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.o-c:empty{display:none}
.o-c i{font-style:normal;font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--tx2)}
.o-c i.g{color:#a6e6b1;background:rgba(127,208,142,.13)} .o-c i.b{color:#f5b3a6;background:rgba(240,144,127,.13)}
.m-note{margin:12px 6px 0;font-size:11.5px;color:var(--tx3);line-height:1.45}

/* нижняя полоса */
.bottom{position:fixed;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:12px}
.ammo{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;min-width:200px}
.a-n{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.a-n sup{font-size:13px;color:var(--acc);margin-left:2px;vertical-align:14px}
.a-n small{font-size:14px;color:var(--tx3);font-weight:600;margin-left:3px}
.ammo.low .a-n{color:var(--bad)}
.a-batt{display:flex;flex-direction:column;gap:4px;margin-left:4px;padding-left:12px;border-left:1px solid var(--line)}
.a-batt .bt{display:grid;grid-template-columns:118px 54px 62px;align-items:center;gap:6px;font-size:11px;color:var(--tx3)}
.a-batt .bt span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.a-batt kbd{font:600 9.5px/1 var(--f);padding:2px 4px;border-radius:3px;border:1px solid var(--line2);color:var(--tx2)}
.shot-info{position:fixed;left:50%;top:62px;transform:translateX(-50%);padding:6px 12px;border-radius:8px;background:rgba(18,20,24,.88);border:1px solid var(--line);font-size:12px;color:var(--tx2);display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.shot-info.on{display:block}
.shot-info b{color:var(--tx);font-weight:650;margin-right:4px}
.ads-hint i{font-style:normal;color:var(--acc)}
.a-batt .bt.on span{color:var(--tx)}
.a-batt i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.a-batt em{display:block;height:100%;background:var(--good)}
.a-batt .bt.low em{background:var(--bad)}
.a-batt .bt.low b{color:var(--bad)}
.a-batt b{font-weight:650;color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
.a-batt b small{font-weight:500;font-size:9.5px;color:var(--tx3);margin-left:3px}
.a-m{display:flex;flex-direction:column;gap:3px}
.a-m b{font-size:12px;letter-spacing:.08em;color:var(--acc)}
.a-m span{font-size:12px;color:var(--tx2)}
.bar{flex:1 1 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;margin:0 auto;max-width:max-content}
.mods-toggle{display:none;flex:none}
.help-btn{flex:none;width:40px;height:40px;padding:0;font-size:16px;border-radius:50%}
.help{position:fixed;right:16px;bottom:72px;padding:12px 14px;width:300px;display:none;font-size:12.5px;color:var(--tx2);line-height:1.9;z-index:12}
.help.on{display:block}
.help kbd{display:inline-block;min-width:22px;padding:0 6px;margin-right:6px;text-align:center;font:600 11px/20px var(--f);color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:5px}
.h-n{margin-top:6px;font-size:11.5px;color:var(--tx3);line-height:1.5}
.ui.show-mods .help{right:382px}

.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-8px);padding:9px 16px;border-radius:8px;background:rgba(18,20,24,.96);border:1px solid var(--line2);
  font-size:13px;color:var(--tx);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;padding:5px 9px;border-radius:6px;background:rgba(18,20,24,.96);border:1px solid var(--line2);font-size:12px;color:var(--tx);pointer-events:none;opacity:0;white-space:nowrap}
.tip.on{opacity:1}

/* режим прицеливания: убираем лишнее */
.ui.ads .col-left,.ui.ads .mods{opacity:0;pointer-events:none;transition:opacity .2s}
.ui.ads .bar .btn:not(.fire):not([data-id=ads]):not([data-id=sight]):not([data-id=mag3]):not([data-id=light]):not([data-id=laser]):not([data-id=time]){display:none}
.ads-hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;background:rgba(18,20,24,.9);border:1px solid var(--line);font-size:12.5px;display:none;text-align:center}
.ads-hint.on{display:block}
.ads-hint span{display:block;margin-top:2px;color:var(--tx3);font-size:11.5px}
.scope{position:fixed;inset:0;pointer-events:none;display:none;
  background:radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(42vw,42vh) - 6px), rgba(0,0,0,.55) calc(min(42vw,42vh) - 2px), #000 min(42vw,42vh))}
.scope.on{display:block}
.nv-ov{position:fixed;inset:0;pointer-events:none;display:none;
  background:radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(40vw,40vh) - 18px), rgba(0,8,0,.7) calc(min(40vw,40vh) - 4px), #000 min(40vw,40vh))}
body.nv .nv-ov{display:block}
body.nv canvas{filter:grayscale(1) sepia(1) hue-rotate(52deg) saturate(2.6) brightness(1.1) contrast(1.2)}
.s-ret{position:absolute;inset:0;overflow:hidden}

@media (max-width:1180px){
  .col-left{width:236px}
  .mods{width:310px}
  .ui.show-mods .help{right:342px}
}
@media (max-width:900px){
  .col-left{width:auto;right:16px;flex-direction:row;align-items:flex-start}
  .stats{display:none}
  .c-spec{display:none}
  .card{padding:10px 12px}
  .mods{top:auto;left:8px;right:8px;width:auto;bottom:124px;max-height:52vh}
  .mods-toggle{display:inline-block}
  .ui:not(.show-mods) .mods{display:none}
  .bottom{left:8px;right:8px;bottom:8px;flex-wrap:wrap}
  .ammo{min-width:0;padding:8px 12px}
  .a-n{font-size:24px}
  .bar{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;max-width:none}
  .help{right:8px;left:8px;width:auto;bottom:124px}
  .ui.show-mods .help{right:8px}
}

/* signum:embed */
body.embed{--el:292px;--et:120px}
body.embed .col-left{visibility:hidden;pointer-events:none;width:calc(var(--el) - 16px)!important;right:auto!important}
body.embed .mods{top:var(--et);bottom:16px;width:340px}
body.embed .bottom{left:var(--el);right:372px;gap:8px}
body.embed .ammo{min-width:0;padding:8px 12px;gap:10px}
body.embed .a-n{font-size:24px}
body.embed .bar{padding:6px;gap:4px}
body.embed .bar .btn{height:30px;padding:0 9px;font-size:11.5px}
body.embed .help,body.embed .ui.show-mods .help{right:372px;bottom:72px}
body.embed .toast,body.embed .ads-hint{top:calc(var(--et) + 4px)}
body.embed .shot-info{top:calc(var(--et) + 48px)}
</style>

void main() {

  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

uniform vec2 uC;

uniform vec3 uCamL, uTint;

    u.uImg.value = rt.texture;

    cam.up.copy(o.up);

    // и в основном кадре ствол оставался без собственной тени, пока стоит оптика
    const sm = this.R.shadowMap, shadowNeeds = sm.needsUpdate;

    this.R.render(this.scene, cam);
    this.R.setRenderTarget(prev);

    o.gun.visible = vis;
    u.uLive.value = 1;
    return true;
  }
  dispose() {
    this.release();
    this.rt?.dispose();
    this.rt = null;
    this.size = 0;
  }
};

// Тактический фонарь SureFire Scout / Modlite / Streamlight: хвостовик с рифлёной крышкой и
// резиновой кнопкой (или вилкой выносной кнопки с кабелем и «таблеткой» на планке),
// корпус с насечкой-кольцами, голова со «скаллопами», стальной безель, отражатель + LED за стеклом.

// Голова фонаря: полированный отражатель (виден через стекло), светодиод на медной подложке
// с жёлтым куполом люминофора, просветлённое стекло. glow — светящийся диск перед светодиодом:
// его яркость ведёт app (батарея).
function lampHead(ctx, r, xFront, xDeep, cy, o = {}) {
  const k = ctx.kit();
  const depth = xFront - xDeep, prof = [];
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, x = xDeep + depth * t;
    prof.push([x, 2.2 + (r - 2.2) * Math.sqrt(t)]);
  }
  const refl = latheX([[xDeep - 0.2, 0], ...prof, [xFront, r], [xFront, r + 0.3], [xDeep - 0.6, 2.6], [xDeep - 0.6, 0]].reverse(), { seg: 40, crease: 70 });
  k.add(o.stipple ? "steelWorn" : "chrome", T(refl, { p: [0, cy, 0] }));
  k.add("copper", T(box(0.8, 6, 6, { bevel: 0.2 }), { p: [xDeep + 0.2, cy, 0] }));
  k.add("paintWhite", T(box(0.6, 3.2, 3.2, { bevel: 0.1 }), { p: [xDeep + 0.7, cy, 0] }));
  k.add("paintWhite#d9c25c", T(latheX([[0, 0], [0, 1.3], [0.5, 1.1], [0.8, 0.6], [0.9, 0]], { seg: 14 }), { p: [xDeep + 0.9, cy, 0] }));
  const group = node("lampHead", [k.build()]);
  const glass = lens(ctx, cylX(r + 0.2, xFront - 1.4, xFront - 0.6, { seg: 40 }).translate(0, cy, 0), "glass");
  const glow = new ctx.THREE.Mesh(cylX(r * 0.55, xDeep + 1, xDeep + 1.4, { seg: 24 }).translate(0, cy, 0), ctx.mats.get("lampLens").clone());
  glow.material.transparent = true;
  glow.material.opacity = 0.95;
  group.add(glass, glow);
  return { group, glow };
}

    k.add("lensBlack", T(cylX(3.1, L1 + 0.4, L1 + 1.2, { seg: 16 }), { p: [0, vis[1], z] }));

  if (z0Illum(o)) {
    const iy = H * 0.42, iz = W * 0.18;
    k.add(o.mat, T(tubeX(o.illum + 2.4, o.illum, L1 - 3, L1 + 8, { seg: 32 }), { p: [0, iy, iz] }));
    k.add("rubber", T(flutesX(o.illum + 2.2, L1, L1 + 7, 20, 1.2, 0.8), { p: [0, iy, iz] }));
    k.add("irLens", T(cylX(o.illum - 0.2, L1 + 5, L1 + 6, { seg: 28 }), { p: [0, iy, iz] }));
    k.add("chrome", T(latheX([[L1 + 5.4, 0], [L1 + 5.4, 1.2], [L1 + 2, o.illum - 0.4], [L1 + 2, 0]], { seg: 24 }), { p: [0, iy, iz] }));

  k.add(o.mat, T(ctx.C.knob(8, 5, 18), { r: [0, 0, 90], p: [L0 + 36, H - 1, 0] }));
  k.add("paintWhite", T(box(3, 1, 1.2), { p: [L0 + 36, H + 4.3, 5] }));
  k.add("paintWhite", T(faceTicks(8.4, 10.4, 6, 0, { arc: 150, a0: -75 }), { r: [0, 0, 90], p: [L0 + 36, H - 0.4, 0] }));

    k.add("lensBlack", T(box(4, 0.5, 0.7, { bevel: 0.1 }), { p: [L1 - 16, H + 1.2, z] }));
    k.add("paintWhite", T(box(0.5, 0.3, 2.2), { p: [L1 - 21, H + 0.1, z] }));
  }
  for (const y of [H * 0.72, H * 0.45]) {
    k.add("steel", T(cylZ(3, -W / 2 - 1.2, -W / 2 + 1, { seg: 16 }), { p: [L1 - 16, y, 0] }));
    k.add("lensBlack", T(box(0.7, 4, 0.5, { bevel: 0.1 }), { p: [L1 - 16, y, -W / 2 - 1.2] }));

  k.add(o.mat, T(ctx.C.knob(8.4, 4, 22), { r: [0, 180, 0], p: [L0 - 4, by, bz] }));
  k.add("steel", T(box(1.4, 6, 1.6, { bevel: 0.3 }), { p: [L0 - 8.6, by, bz] }));

  ll.renderOrder = 0;
  ll.material.transparent = false;
  root.add(ll);
  if (o.color) {
    ll.material = ll.material.clone();
    ll.material.emissive.setHex(o.color);
  }
  return { root, laser: { p: [vis[0] + 2, vis[1], vis[2]], lens: ll, color: o.color, batt: o.batt } };
}

// Вертикальная рукоять: зажим с барашком, тело с рёбрами/кольцами хвата, торцевая крышка отсека.
function vgrip(ctx, o) {
  const k = ctx.kit();
  const L = o.len, d = o.d;
  k.add("poly", clampBody(-d / 2 - 2, d / 2 + 2, 5, { w: 26 }));
  const prof = [[0, 0], [0, d / 2 - 0.5]];
  const n = 16;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const r = d / 2 - t * 2 + (o.ribs && i % 2 ? 0.8 : 0) + (!o.ribs ? 0.6 * Math.sin(t * Math.PI * 3) * (t > 0.15 && t < 0.85 ? 1 : 0) : 0);
    prof.push([4 + t * (L - 10), r]);

  prof.push([L - 3, d / 2 - 2.5], [L, d / 2 - 5], [L, 0]);
  const body = latheX(prof, { seg: 32, crease: 50 });
  k.add("poly", T(body, { r: [0, 0, 90], p: [o.tilt ?? 0, 3, 0], s: [1, 1, o.flat ?? 1] }));
  k.add("polySoft", T(cylY(d / 2 - 3.2, L + 1.4, L + 4, { c: 1, seg: 28 }), { s: [1, 1, o.flat ?? 1] }));
  k.add("polySoft", T(box(d * 0.6, 1.4, 2.4, { bevel: 0.5 }), { p: [0, L + 4.4, 0] }));
  k.add("steel", T(thumbNut(5.6, 3.6, 6), { r: [0, -90, 0], p: [0, -2.5, 13] }));
  k.add("steel", crossBolt(0, -2.5, 13, { nutR: 0 }));
  return { root: k.build(o.name) };
}

function grip(ctx, o) {
  const k = ctx.kit();
  const a = (o.angle ?? 20) * Math.PI / 180;
  const H = o.h ?? 104;
  const sh = (y) => -Math.tan(a) * -y;
  const front = o.front.map(([f, y]) => [sh(y) + f, y]);
  const back = o.back.map(([f, y]) => [sh(y) + f, y]);
  k.add(o.mat || "poly", gripLoft(front, back, { w: o.w ?? 30, width: (t) => 0.86 + 0.14 * Math.sin(Math.PI * Math.min(1, t * 1.6)) }));

    const tx = [];
    for (let i = 0; i < 9; i++) {

      for (const s of [-1, 1]) tx.push(T(box(16, 1.1, 1.2, { bevel: 0.3 }), { p: [sh(y) - 22, y, s * ((o.w ?? 30) / 2 * 0.9 - 0.2)], r: [0, 0, o.angle ?? 20] }));

    k.add(o.mat || "poly", tx);
  }

  return { root: k.build(o.name) };
}

// Единая библиотека модулей для всех стволов. Совместимость решают категория, планка и fit/only:

// src/weapons/shared.js
// Общие детали для описаний оружия: магазины, антабки, «сухари» для прикладов.

// Коробчатый магазин с изгибом радиуса R (Infinity/0 — прямой). Начало координат — передний верх корпуса,
// корпус уходит назад (−x) на глубину d0 и вниз по дуге на длину len. Губки поднимаются на lipH над нулём.
function boxMag(ctx, o) {
  const { T: T2, extrudeZ: exZ, box: bx, wire: wr, node: nd } = ctx.G;
  const k = ctx.kit(), rk = ctx.kit();
  const R4 = o.R && isFinite(o.R) ? o.R : 1e5, L = o.len, D0 = o.d0, D1 = o.d1 ?? o.d0, W = o.w;
  const lipH = o.lipH ?? 10;
  const cx = -D0 / 2 + R4, n = 18, back = [], front = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n * L, a = Math.PI + s / R4, d = D0 + (D1 - D0) * (i / n);
    const px = cx + Math.cos(a) * R4, py = Math.sin(a) * R4, nx = Math.cos(a), ny = Math.sin(a);
    back.push([px + nx * d / 2, py + ny * d / 2]);
    front.push([px - nx * d / 2, py - ny * d / 2]);
  }
  const sx = -front[0][0];
  const P = [[front[0][0], lipH], [back[0][0], lipH], ...back.slice(1), ...front.slice().reverse()].map(([x, y]) => [x + sx, y, 0]);
  k.add(o.mat, exZ(P, W, { bevel: o.bevel ?? 1 }));
  const endA = Math.PI + L / R4;
  const ex = cx + Math.cos(endA) * R4 + sx, ey = Math.sin(endA) * R4;
  const tx = -Math.sin(endA), ty = Math.cos(endA);
  if (o.ribs) {
    for (let j = 1; j < 3; j++) {
      const pts = [];
      for (let i = 1; i < n; i++) {
        const s = i / n * L, a = Math.PI + s / R4, d = D0 + (D1 - D0) * (i / n), t = j / 3 - 0.5;
        pts.push([cx + Math.cos(a) * (R4 + t * d) + sx, Math.sin(a) * (R4 + t * d)]);
      }
      for (const s of [-1, 1]) k.add(o.ribMat || o.mat, wr(pts.map((p) => [p[0], p[1], s * (W / 2 + 0.1)]), o.ribR ?? 1, { n: 40, seg: 6 }));
    }
  }
  if (o.window) for (const s of [-1, 1]) k.add("lensBlack", T2(bx(5, L * 0.55, 1, { bevel: 0.4 }), { p: [-D0 * 0.72, -L * 0.45, s * (W / 2 + 0.05)] }));
  // затыльник-крышка
  const pl = o.plateH ?? 5;
  k.add(o.plate || o.mat, T2(bx(D1 + (o.plateOver ?? 5), pl, W + (o.plateW ?? 2.5), { bevel: Math.min(1.6, pl * 0.3) }), { p: [ex + tx * pl * 0.4, ey + ty * pl * 0.4, 0], r: [0, 0, endA * 57.3] }));
  if (o.catchX != null) k.add(o.mat, T2(bx(5, 3.2, W - 4), { p: [o.catchX, o.catchY ?? -6, 0] }));
  ctx.C.feedLips(k, o.lipMat || o.mat, -D0 + (o.lipX0 ?? 4), -D0 + (o.lipX1 ?? D0 * 0.62), lipH, W / 2, { rise: o.lipRise ?? 3, curl: o.lipCurl ?? 2.4 });
  const cr = ctx.C.CAL[o.cal];
  const dx = (cr?.rim ?? 10) * 0.42;
  ctx.C.cartridge(rk, o.cal, { p: [-D0 + 2.5, lipH + 1.5, -dx * 0.5], r: [0, 0, o.roundTilt ?? 2] });
  ctx.C.cartridge(rk, o.cal, { p: [-D0 + 2.5, lipH + 1.5 - dx * 1.05, dx * 0.5], r: [0, 0, o.roundTilt ?? 2] });
  const rounds = rk.build("rounds");
  return { root: nd("mag", [k.build(), rounds]), mag: { cap: o.cap, rounds } };
}
// Барабан под коробчатой горловиной (горловина — boxMag укороченной длины).
function drumMag(ctx, o) {
  const { T: T2, cylZ: cZ, box: bx, node: nd } = ctx.G;

  }
  k.add(o.ringMat || "steel", T2(cZ(r - 2, -w * 0.1, w * 0.1, { seg: 48 }), { p: [cx, cy, 0] }));
  k.add("steel", T2(ctx.C.knob(r * 0.24, 5, 16), { r: [0, -90, 0], p: [cx, cy, w / 2 + 4] }));
  return { root: nd("drum", [neck.root, k.build()]), mag: { cap: o.cap, rounds: neck.mag.rounds } };

  k.add("steelMatte", fl(9, 14, 25, 16, 1.2, 0.5));
  return { root: nd("cap", [k.build()]), muzzle: { x: 27, kind: "bare", flash: 1 } };
}
function hk3Fh(ctx) {
  const { latheX: lX, T: T2, box: bx, node: nd } = ctx.G;
  const k = ctx.kit();
  k.add("steelMatte", lX([[-6, 0], [-6, 12.6], [-4, 13.2], [8, 13.2], [10, 11], [48, 11], [49, 9.8], [49, 5.6], [10, 5.6], [10, 0]], { seg: 36 }));
  for (let i = 0; i < 4; i++) k.add("lensBlack", T2(bx(26, 2.4, 3.4, { bevel: 0.5 }), { p: [33, 10.3, 0], r: [45 + i * 90, 0, 0] }));
  return { root: nd("fh3", [k.build()]), muzzle: { x: 49, kind: "fh", flash: 0.4 } };
}
function hk3Comp(ctx) {
  const { latheX: lX, T: T2, box: bx, cylY: cY, node: nd } = ctx.G;
  const k = ctx.kit();
  k.add("steelMatte", lX([[-6, 0], [-6, 13.4], [42, 13.4], [43, 12], [43, 5], [40, 5], [40, 0]], { seg: 36 }));
  for (let i = 0; i < 3; i++) k.add("lensBlack", T2(cY(2.4, 0, 3, { seg: 12 }), { p: [16 + i * 9, 11.4, 0] }));
  for (const s of [-1, 1]) k.add("lensBlack", T2(bx(8, 6, 3, { bevel: 1 }), { p: [30, 3, s * 11.8] }));

function hk3Can(ctx, o) {
  const { latheX: lX, flutesX: fl, ringGrooves: rg, tubeX: tb, cylX: cX, node: nd } = ctx.G;
  const k = ctx.kit();
  const R4 = o.r, L = o.len;
  // замок на три зацепа: рычаг-защёлка и рифлёная муфта
  k.add("steelMatte", lX([[-8, 0], [-8, R4 - 5], [-6, R4 - 3], [22, R4 - 3], [24, R4], [L - 6, R4], [L - 2, R4 - 2.6], [L, R4 - 5], [L, 5.4], [L - 2.5, 4.8], [L - 2.5, 0]], { seg: 48, crease: 30 }));
  k.add("steelMatte", rg(R4 - 2.6, -6, 20, 8, 0.6, { seg: 44 }));
  if (o.fins) k.add("steelMatte", fl(R4 - 0.3, 34, L - 16, o.fins, 3, 0.9));

function mp5Mag(ctx, o) {
  const m = boxMag(ctx, { d0: 35.5, d1: 34, w: 22, lipH: 9, lipX0: 4, lipX1: 26, lipRise: 2.6, lipCurl: 2.2, cal: "9x19", plateOver: 5, catchX: -34, catchY: -2, ...o });
  // контрольные окна у задней стенки (каждые 10 патронов) — повторяют дугу корпуса
  const { T: T2, cylZ: cZ } = ctx.G;
  const k = ctx.kit();
  const R = o.R && isFinite(o.R) ? o.R : 1e5, D0 = 35.5, D1 = 34, cx = -D0 / 2 + R, n = Math.max(2, Math.round(o.cap / 10));
  for (let i = 0; i < n; i++) {
    const t = 0.18 + 0.64 * i / (n - 1), a = Math.PI + t * o.len / R, rr = R + (D0 + (D1 - D0) * t) / 2 - 5;
    for (const s of [-1, 1]) k.add("lensBlack", T2(cZ(1.4, -0.35, 0.35, { seg: 12, c: 0 }), { p: [cx + Math.cos(a) * rr, Math.sin(a) * rr, s * 11] }));
  }
  m.root.add(k.build());
  return m;
}
